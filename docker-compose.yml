services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meditrack
      POSTGRES_USER: meditrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env (voir .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditrack -d meditrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      # VULN-04 corrigée : la connexion utilise les variables PG* et les secrets viennent de .env
      PGHOST: db
      PGPORT: "5432"
      PGUSER: meditrack
      PGDATABASE: meditrack
      PGPASSWORD: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env (voir .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Definissez JWT_SECRET dans .env (voir .env.example)}
      API_KEY: ${API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node db/seed.js && node src/app.js"

volumes:
  pgdata: